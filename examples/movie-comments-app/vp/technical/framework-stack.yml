id: technical-framework-stack
title: Requested Vue, Ant Design Vue, and GraphQL stack stays in place
severity: blocker
category: framework
runner:
  kind: custom
  framework: custom
app:
  kind: technical
  root: .
assert:
  - path_exists:
      path: package.json
  - script_present:
      name: dev
  - dependency_present:
      name: vue
      section: all
  - dependency_present:
      name: ant-design-vue
      section: all
  - dependency_present:
      name: graphql
      section: all
