id: behavior-persist-movie-comments-after-restart
feature: Movie comments
scenario: Added movie comments persist after an application restart
severity: blocker
runner:
  kind: gherkin
  framework: cucumber
executor:
  kind: api
  framework: playwright-request
state:
  kind: sqlite
  connection: ./test.db
  reset_sql: |-
    CREATE TABLE IF NOT EXISTS movies (
      movie_id INTEGER PRIMARY KEY,
      slug TEXT NOT NULL,
      title TEXT NOT NULL,
      release_year INTEGER NOT NULL,
      poster_url TEXT NOT NULL,
      synopsis TEXT NOT NULL
    );
    CREATE TABLE IF NOT EXISTS movie_comments (
      comment_id INTEGER PRIMARY KEY,
      movie_id INTEGER NOT NULL,
      author TEXT NOT NULL,
      body TEXT NOT NULL,
      created_at TEXT NOT NULL,
      FOREIGN KEY (movie_id) REFERENCES movies(movie_id)
    );
    DELETE FROM movie_comments;
    DELETE FROM movies;
    INSERT INTO movies (movie_id, slug, title, release_year, poster_url, synopsis)
    VALUES (
      1,
      'arrival',
      'Arrival',
      2016,
      'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="360"><rect width="100%" height="100%" fill="%23141b2d"/><text x="50%" y="50%" fill="white" font-size="28" text-anchor="middle" dominant-baseline="middle">Arrival</text></svg>',
      'A linguist works with alien visitors to understand their language before conflict escalates.'
    );
app:
  kind: api
  base_url: http://localhost:3000
given:
  - request:
      method: POST
      path: /graphql
      headers:
        content-type: application/json
      body_json:
        query: |-
          mutation AddMovieComment {
            addMovieComment(movieId: 1, author: "Nadia", body: "Loved the ending.") {
              commentId
              author
              body
            }
          }
when:
  - restart_app:
      wait_for_ready_ms: 10000
      wait_after_ms: 200
  - request:
      method: POST
      path: /graphql
      headers:
        content-type: application/json
      body_json:
        query: |-
          query MovieDetailAfterRestart {
            movie(movieId: 1) {
              movieId
              title
              posterUrl
              comments {
                author
                body
              }
            }
          }
then:
  - status: 200
  - header_matches:
      name: content-type
      matches: json
  - json_absent:
      path: $.errors
  - json_equals:
      path: $.data.movie.title
      equals: Arrival
  - json_array_includes:
      path: $.data.movie.comments
      equals:
        author: Nadia
        body: Loved the ending.
