id: api-get-score-history
title: POST /graphql reads persisted score history
severity: blocker
state:
  kind: sqlite
  connection: ./test.db
  reset_sql: |-
    CREATE TABLE IF NOT EXISTS score_history (
      game_id INTEGER PRIMARY KEY,
      winner TEXT NOT NULL,
      moves_json TEXT NOT NULL,
      move_count INTEGER NOT NULL,
      finished_at TEXT NOT NULL
    );
    DELETE FROM score_history;
    INSERT INTO score_history (game_id, winner, moves_json, move_count, finished_at)
    VALUES (1, 'X', '[0,3,1,4,2]', 5, '2026-01-01T00:00:00.000Z');
app:
  kind: api
  base_url: http://localhost:3000
request:
  method: POST
  path: /graphql
  headers:
    content-type: application/json
  body_json:
    query: |-
      query ScoreHistory {
        scoreHistory {
          gameId
          winner
          moveCount
        }
      }
assert:
  - status: 200
  - header_matches:
      name: content-type
      matches: json
  - json_absent:
      path: $.errors
  - json_array_includes:
      path: $.data.scoreHistory
      equals:
        winner: X
        moveCount: 5
